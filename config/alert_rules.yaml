alerts:
  - name: LLMResponseLatencySLOBreach
    severity: critical
    condition: 'latency_p95_ms > 3000'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: llm-platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: LLMRequestErrorRateHigh
    severity: critical
    condition: 'error_rate_pct > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: LLMAnswerQualityDegraded
    severity: warning
    condition: 'quality_score_avg < 0.75 or retrieval_success_rate_pct < 90'
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: llm-quality-oncall
    runbook: docs/alerts.md#alert-3
